<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catálogo con CSS Grid</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="encabezado">
      <div>
        <p>Práctica de CSS Grid</p>
        <h1>Mercado del grupo A</h1>
      </div>
    </header>

    <main>
      <section aria-labelledby="productos-titulo">
        <h2 id="productos-titulo">Productos destacados</h2>
        <div class="cuadricula">
          <article class="producto">
            <div class="producto__imagen" aria-hidden="true">🍎</div>
            <h3>Manzana</h3><p>Fruta fresca por kilogramo.</p><strong>$48</strong>
          </article>
          <article class="producto">
            <div class="producto__imagen" aria-hidden="true">🥖</div>
            <h3>Pan</h3><p>Horneado durante la mañana.</p><strong>$35</strong>
          </article>
          <article class="producto">
            <div class="producto__imagen" aria-hidden="true">🥛</div>
            <h3>Leche</h3><p>Presentación de un litro.</p><strong>$29</strong>
          </article>
          <article class="producto">
            <div class="producto__imagen" aria-hidden="true">☕</div>
            <h3>Café</h3><p>Molido y listo para preparar.</p><strong>$95</strong>
          </article>
        </div>
      </section>
    </main>
  </body>
</html>
