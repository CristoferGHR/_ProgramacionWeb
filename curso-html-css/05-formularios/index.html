<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulario de registro</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main>
      <form class="formulario" action="#" method="post">
        <div>
          <p class="sobrelinea">Grupo A</p>
          <h1>Registro al taller</h1>
          <p>Los campos marcados con * son obligatorios.</p>
        </div>

        <div class="campo">
          <label for="nombre">Nombre completo *</label>
          <input id="nombre" name="nombre" type="text" autocomplete="name" required />
        </div>

        <div class="campo">
          <label for="correo">Correo electrónico *</label>
          <input id="correo" name="correo" type="email" autocomplete="email" required />
        </div>

        <div class="campo">
          <label for="matricula">Matrícula *</label>
          <input
            id="matricula"
            name="matricula"
            type="text"
            inputmode="numeric"
            pattern="[0-9]{6,10}"
            aria-describedby="ayuda-matricula"
            required
          />
          <small id="ayuda-matricula">Escribe entre 6 y 10 números.</small>
        </div>

        <div class="campo">
          <label for="tema">Tema que deseo reforzar</label>
          <select id="tema" name="tema">
            <option value="html">HTML semántico</option>
            <option value="css">Selectores y caja</option>
            <option value="layout">Flexbox y Grid</option>
          </select>
        </div>

        <button type="submit">Enviar registro</button>
      </form>
    </main>
  </body>
</html>
